services:
  workmachine:
    build:
      context: .
      args:
        TIMEZONE: "${TZ:-UTC}"
        COKACREMOTE_REPOSITORY: "${COKACREMOTE_REPOSITORY:-https://github.com/kstost/cokacremote.git}"
        COKACREMOTE_REF: "${COKACREMOTE_REF:-main}"
    image: "${WORKMACHINE_IMAGE:-workmachine:local}"
    container_name: "${WORKMACHINE_CONTAINER_NAME:-workmachine}"
    hostname: workmachine
    restart: unless-stopped
    environment:
      TZ: "${TZ:-UTC}"
      MCP_MODE: gateway
      MCP_PUBLIC_URL: "${MCP_PUBLIC_URL:?Set MCP_PUBLIC_URL in .env}"
      MCP_ALLOWED_HOSTS: "${MCP_ALLOWED_HOSTS:-}"
      MCP_OAUTH_ENABLED: "${MCP_OAUTH_ENABLED:-true}"
      MCP_OAUTH_APPROVAL_KEY: "${MCP_OAUTH_APPROVAL_KEY:-}"
      MCP_AUTH_TOKEN: "${MCP_AUTH_TOKEN:-}"
      MCP_GENERIC_BACKEND_URL: "http://generic-backend:3000/mcp"
      MCP_BRIDGE_EXCHANGE_ROOT: /var/lib/aias-bridge/exchange
      MCP_BRIDGE_ATTESTATION_KEY_FILE: /run/secrets/aias-bridge-attestation-key
      MCP_BRIDGE_GENERATION: "${MCP_BRIDGE_GENERATION:?Set MCP_BRIDGE_GENERATION in .env}"
      MCP_GATEWAY_SOURCE_FINGERPRINT: "${MCP_GATEWAY_SOURCE_FINGERPRINT:?Set MCP_GATEWAY_SOURCE_FINGERPRINT in .env}"
      MCP_BRIDGE_REQUEST_TTL_SECONDS: "${MCP_BRIDGE_REQUEST_TTL_SECONDS:-300}"
      MCP_BRIDGE_RESULT_WAIT_MS: "${MCP_BRIDGE_RESULT_WAIT_MS:-30000}"
      MCP_MAX_REQUEST_BODY: "${MCP_MAX_REQUEST_BODY:-8mb}"
    volumes:
      - type: volume
        source: cokacremote-state
        target: /var/lib/cokacremote
      - type: bind
        source: "${BRIDGE_EXCHANGE_PATH:?Set BRIDGE_EXCHANGE_PATH in .env}"
        target: /var/lib/aias-bridge/exchange
      - type: bind
        source: "${BRIDGE_ATTESTATION_KEY_PATH:?Set BRIDGE_ATTESTATION_KEY_PATH in .env}"
        target: /run/secrets/aias-bridge-attestation-key
        read_only: true
    networks:
      - public
      - backend
    depends_on:
      generic-backend:
        condition: service_healthy
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-H", "Host: localhost", "http://127.0.0.1:2999/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  generic-backend:
    image: "${WORKMACHINE_IMAGE:-workmachine:local}"
    container_name: "${GENERIC_BACKEND_CONTAINER_NAME:-workmachine-generic-backend}"
    hostname: generic-backend
    restart: unless-stopped
    environment:
      TZ: "${TZ:-UTC}"
      MCP_MODE: generic-backend
      MCP_ALLOW_NO_AUTH: "true"
      MCP_OAUTH_ENABLED: "false"
      MCP_AUTH_TOKEN: ""
      MCP_HOST: 0.0.0.0
      MCP_PORT: "3000"
      MCP_ENDPOINT: /mcp
      MCP_TRUST_PROXY_HOPS: "0"
      MCP_DEFAULT_CWD: /shared
    volumes:
      - type: bind
        source: "${SHARED_PATH:?Set SHARED_PATH in .env}"
        target: /shared
    networks:
      - backend
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 6

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: "${CLOUDFLARED_CONTAINER_NAME:-chatgpt-cloudflared}"
    restart: unless-stopped
    network_mode: "service:workmachine"
    depends_on:
      workmachine:
        condition: service_healthy
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - "${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN in .env}"

networks:
  public:
  backend:

volumes:
  cokacremote-state:
